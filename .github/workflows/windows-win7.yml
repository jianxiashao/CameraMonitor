name: Build Windows 7 x64 EXE

# Windows 7 上跑不了 Qt 6（Qt 6 要求 Windows 10+），Python 也必须是 3.8
# （Python 3.9 起官方不再支持 Windows 7）。所以这份流程单独用
# Python 3.8 x64 + PySide2 5.15（Qt 5.15）打包，源码靠
# camera_monitor/qt_compat.py 继续按 PySide6 的名字导入 Qt。
# 只在手动运行（或在 release.yml 里被复用时）执行，push 不会自动构建；
# 手动运行成功后，产物会压缩上传到 v{版本号} 的 Release，长期可下载。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-win7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-win7.txt
            packaging/requirements-build-win7.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install -r packaging/requirements-win7.txt -r packaging/requirements-build-win7.txt
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          # tests/ 里的模块按 PySide6 的名字导入 Qt，sitecustomize.py 负责在
          # 解释器启动时把 PySide6 映射到 PySide2（PySide6 环境里它什么也不做）
          CAMERA_MONITOR_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}\packaging\win7
        shell: pwsh
        # 完整日志要登录才能看；失败时把每一条错误转成注解，运行概览页上直接可见
        run: |
          python -m unittest discover -s tests -v *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          if ($code -ne 0) { python packaging/annotate_failures.py test-output.txt }
          exit $code
      - name: Build portable EXE
        env:
          # 打包时不能让 sitecustomize 生效：那会把模块按 PySide6 的名字收进包里
          PYTHONPATH: ''
        run: python -m PyInstaller --noconfirm --clean --distpath dist-win7 --workpath build-win7 packaging/CameraMonitor-win7.spec
      - name: Verify Windows 7 executable
        run: python packaging/verify-windows-win7-exe.py dist-win7/CameraMonitor.exe
      - name: Test packaged application startup
        run: python packaging/smoke-windows-exe.py dist-win7/CameraMonitor.exe
      - name: Prepare download
        shell: pwsh
        run: |
          Copy-Item packaging/Windows7使用说明.md dist-win7/使用说明.md
          $hash = (Get-FileHash dist-win7/CameraMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CameraMonitor.exe" | Set-Content dist-win7/SHA256SUMS.txt -Encoding utf8
          "Commit: $env:GITHUB_SHA`nBuild: $env:GITHUB_RUN_NUMBER`nTarget: Windows 7 SP1 x64`nPython: 3.8 x64`nQt: PySide2 5.15.2.1 (Qt 5.15.2)`nCamera network acceptance: pending" | Set-Content dist-win7/BUILD.txt -Encoding utf8
      - name: Upload EXE and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CameraMonitor-Windows7-x64
          path: dist-win7/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # 只有手动运行时才发 Release；被 release.yml 调用时由那个流程统一发布（发布 macOS + 两个 Windows）
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read version tag
        id: version
        shell: pwsh
        # 版本号只有 camera_monitor/__init__.py 一处，Release 的 tag 就用它
        run: |
          $version = (Select-String -Path camera_monitor/__init__.py -Pattern "__version__\s*=\s*'([^']+)'").Matches[0].Groups[1].Value
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Fetch and check the build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download ${{ github.run_id }} -n CameraMonitor-Windows7-x64 -D package
          $actual = (Get-FileHash package/CameraMonitor.exe -Algorithm SHA256).Hash.ToLower()
          $expected = ((Get-Content package/SHA256SUMS.txt -Encoding utf8) -split '\s+')[0].Trim()
          if ($actual -ne $expected) { throw "SHA256 不一致：$actual != $expected" }
          Compress-Archive -Path package/* -DestinationPath CameraMonitor-Windows7-x64.zip -Force
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        # 用 GITHUB_TOKEN 创建 Release 不会反过来触发别的 workflow；
        # Release 已存在就覆盖同名资产，两个 Windows 构建共用同一个 Release
        run: |
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG CameraMonitor-Windows7-x64.zip --clobber
          } else {
            gh release create $env:TAG CameraMonitor-Windows7-x64.zip --title "Camera Monitor $env:TAG" --notes-file packaging/RELEASE.md
            if ($LASTEXITCODE -ne 0) {
              # 另一个构建刚好抢先创建了同一个 Release：退化成覆盖上传
              gh release upload $env:TAG CameraMonitor-Windows7-x64.zip --clobber
            }
          }
          gh release view $env:TAG --json url --jq .url
