name: Build Windows 7 x64 EXE

# Windows 7 上跑不了 Qt 6（Qt 6 要求 Windows 10+），Python 也必须是 3.8
# （Python 3.9 起官方不再支持 Windows 7）。所以这份流程单独用
# Python 3.8 x64 + PySide2 5.15（Qt 5.15）打包，源码靠
# camera_monitor/qt_compat.py 继续按 PySide6 的名字导入 Qt。
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'camera_monitor/**'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/windows-win7.yml'

permissions:
  contents: read

concurrency:
  group: windows-win7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-win7.txt
            packaging/requirements-build-win7.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install -r packaging/requirements-win7.txt -r packaging/requirements-build-win7.txt
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          # tests/ 里的模块按 PySide6 的名字导入 Qt，sitecustomize.py 负责在
          # 解释器启动时把 PySide6 映射到 PySide2（PySide6 环境里它什么也不做）
          CAMERA_MONITOR_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}\packaging\win7
        shell: pwsh
        # 完整日志要登录才能看；失败时把每一条错误转成注解，运行概览页上直接可见
        run: |
          python -m unittest discover -s tests -v *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          if ($code -ne 0) { python packaging/annotate_failures.py test-output.txt }
          exit $code
      - name: Build portable EXE
        env:
          # 打包时不能让 sitecustomize 生效：那会把模块按 PySide6 的名字收进包里
          PYTHONPATH: ''
        run: python -m PyInstaller --noconfirm --clean --distpath dist-win7 --workpath build-win7 packaging/CameraMonitor-win7.spec
      - name: Verify Windows 7 executable
        run: python packaging/verify-windows-win7-exe.py dist-win7/CameraMonitor.exe
      - name: Test packaged application startup
        run: python packaging/smoke-windows-exe.py dist-win7/CameraMonitor.exe
      - name: Prepare download
        shell: pwsh
        run: |
          Copy-Item packaging/Windows7使用说明.md dist-win7/使用说明.md
          $hash = (Get-FileHash dist-win7/CameraMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CameraMonitor.exe" | Set-Content dist-win7/SHA256SUMS.txt -Encoding utf8
          "Commit: $env:GITHUB_SHA`nBuild: $env:GITHUB_RUN_NUMBER`nTarget: Windows 7 SP1 x64`nPython: 3.8 x64`nQt: PySide2 5.15.2.1 (Qt 5.15.2)`nCamera network acceptance: pending" | Set-Content dist-win7/BUILD.txt -Encoding utf8
      - name: Upload EXE and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CameraMonitor-Windows7-x64
          path: dist-win7/*
          if-no-files-found: error
          retention-days: 14
