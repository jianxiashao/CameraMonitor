name: Publish desktop release

# 打 v* 标签时发布正式版：Windows 11 x64、Windows 7 SP1 x64、macOS Apple Silicon 三个包。
# 日常改代码不会触发（两个 Windows 构建只在手动运行时执行）。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-exe.yml
  windows-win7:
    uses: ./.github/workflows/windows-win7.yml
  release:
    needs: [windows, windows-win7]
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import platform; assert platform.machine() == 'arm64'"
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt
          # 校验 Windows 7 的 exe 要读 PE 头，pefile 在 macOS 上不会随 PyInstaller 装上
          python -m pip install pefile
          python -m unittest discover -s tests -v
      - name: Build Apple Silicon application
        run: |
          python -m PyInstaller --noconfirm --clean packaging/CameraMonitor.spec
          codesign --verify --deep --strict 'dist/Camera Monitor.app'
          lipo 'dist/Camera Monitor.app/Contents/MacOS/CameraMonitor' -verify_arch arm64
          python packaging/smoke-macos-app.py 'dist/Camera Monitor.app'
      - name: Prepare Apple Silicon download
        run: |
          mkdir -p release-files mac-package
          ditto 'dist/Camera Monitor.app' 'mac-package/Camera Monitor.app'
          cp packaging/macOS使用说明.md mac-package/使用说明.md
          printf 'Commit: %s\nTarget: macOS 14+ Apple Silicon arm64\n' "$GITHUB_SHA" > mac-package/BUILD.txt
          ditto -c -k --sequesterRsrc mac-package release-files/CameraMonitor-macOS-AppleSilicon.zip
      - name: Fetch verified Windows builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n CameraMonitor-Windows11-x64 -D windows-package
          gh run download "$GITHUB_RUN_ID" -n CameraMonitor-Windows7-x64 -D windows7-package
          python packaging/verify-windows-exe.py windows-package/CameraMonitor.exe
          python packaging/verify-windows-win7-exe.py windows7-package/CameraMonitor.exe
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          for folder in ('windows-package', 'windows7-package'):
              p = Path(folder)
              assert os.environ['GITHUB_SHA'] in (p/'BUILD.txt').read_text(encoding='utf-8-sig')
              assert hashlib.sha256((p/'CameraMonitor.exe').read_bytes()).hexdigest() == (p/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').split()[0]
          PY
          (cd windows-package && zip -r ../release-files/CameraMonitor-Windows11-x64.zip .)
          (cd windows7-package && zip -r ../release-files/CameraMonitor-Windows7-x64.zip .)
      - name: Publish all downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-files && shasum -a 256 *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release-files/* --verify-tag --title "Camera Monitor $GITHUB_REF_NAME · Windows / Windows 7 / Apple 芯片 Mac" --notes-file packaging/RELEASE.md
