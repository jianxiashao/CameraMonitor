name: Live RTSP smoke test

# 手动触发：用 ffmpeg 在云端起一路真实 RTSP 流，验证解码线程能连上并解出画面。
# 单独成流程，不参与打包——现场网络环境不一致，跑挂了不该挡住发版。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtsp:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check ffmpeg is available
        run: ffmpeg -version
      - name: Decode one real RTSP stream
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_live_rtsp.py" -v *> rtsp-output.txt
          $code = $LASTEXITCODE
          Get-Content rtsp-output.txt
          exit $code
